<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; }
    a { color: #c8ff4d; } a:hover { color: #d9ff7a; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</helmet>
<div style="width: 480px; min-height: 720px; background: #111111; box-sizing: border-box; display: flex; flex-direction: column;">
  <div style="padding: 32px 32px 24px; border-bottom: 1px solid #232323;">
    <div class="mono" style="font-size: 12px; color: #c8ff4d; margin-bottom: 6px;">[ SIGNAL ]</div>
    <div class="mono" style="font-size: 20px; color: #f0f0f0; font-weight: 700;">brand_kit.config</div>
    <div class="mono" style="font-size: 12px; color: #666; margin-top: 4px;">step 1/3</div>
  </div>
  <div style="padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; flex: 1;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label class="mono" style="font-size: 12px; color: #999;">logo</label>
      <div style="border: 1px dashed #2a2a2a; padding: 24px; text-align: center; color: #555; font-size: 13px;" class="mono">+ upload</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label class="mono" style="font-size: 12px; color: #999;">brand_colors[]</label>
      <div style="display: flex; gap: 10px;">
        <div style="width: 40px; height: 40px; background: #c8ff4d; border: 1px solid #2a2a2a;"></div>
        <div style="width: 40px; height: 40px; background: #0a0a0a; border: 1px solid #2a2a2a;"></div>
        <div style="width: 40px; height: 40px; background: #f0f0f0; border: 1px solid #2a2a2a;"></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label class="mono" style="font-size: 12px; color: #999;">font_pairing</label>
      <input type="text" placeholder="JetBrains Mono / Inter" style="background: #0a0a0a; border: 1px solid #2a2a2a; padding: 10px 12px; color: #f0f0f0; font-size: 14px; font-family: 'JetBrains Mono', monospace;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label class="mono" style="font-size: 12px; color: #999;">tone_of_voice</label>
      <textarea placeholder="// direct, technical, zero fluff" style="background: #0a0a0a; border: 1px solid #2a2a2a; padding: 10px 12px; color: #f0f0f0; font-size: 13px; min-height: 70px; resize: none; font-family: 'JetBrains Mono', monospace;"></textarea>
    </div>
  </div>
  <div style="padding: 24px 32px; border-top: 1px solid #232323; display: flex; justify-content: flex-end;">
    <button class="mono" style="background: #c8ff4d; color: #0a0a0a; border: none; padding: 11px 24px; font-size: 13px; font-weight: 700; cursor: pointer;">next →</button>
  </div>
</div>
</x-dc>
</body>
</html>
