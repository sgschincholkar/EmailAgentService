<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #12141a; }
    a { color: #e8a33d; } a:hover { color: #f4b95a; }
    .serif { font-family: 'Source Serif 4', Georgia, serif; }
    input, textarea, select { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 480px; min-height: 720px; background: #1a1d26; box-sizing: border-box; display: flex; flex-direction: column;">
  <div style="padding: 32px 32px 24px; border-bottom: 1px solid #2a2e3a;">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #e8a33d; margin-bottom: 6px;">Studio Precision</div>
    <div class="serif" style="font-size: 22px; color: #f2f0eb;">Brand Kit</div>
    <div style="font-size: 13px; color: #8b8f9c; margin-top: 4px;">Step 1 of 3</div>
  </div>
  <div style="padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; flex: 1;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 13px; color: #b8bcc8;">Logo</label>
      <div style="border: 1px dashed #3a3f4e; border-radius: 4px; padding: 24px; text-align: center; color: #6b7080; font-size: 13px;">Upload logo</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 13px; color: #b8bcc8;">Brand colors</label>
      <div style="display: flex; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 4px; background: #e8a33d; border: 1px solid #3a3f4e;"></div>
        <div style="width: 40px; height: 40px; border-radius: 4px; background: #1a1d26; border: 1px solid #3a3f4e;"></div>
        <div style="width: 40px; height: 40px; border-radius: 4px; background: #f2f0eb; border: 1px solid #3a3f4e;"></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 13px; color: #b8bcc8;">Font pairing</label>
      <input type="text" placeholder="e.g. Source Serif 4 / Inter" style="background: #12141a; border: 1px solid #3a3f4e; border-radius: 4px; padding: 10px 12px; color: #f2f0eb; font-size: 14px;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="font-size: 13px; color: #b8bcc8;">Tone of voice</label>
      <textarea placeholder="Confident, direct, no corporate filler..." style="background: #12141a; border: 1px solid #3a3f4e; border-radius: 4px; padding: 10px 12px; color: #f2f0eb; font-size: 14px; min-height: 70px; resize: none;"></textarea>
    </div>
  </div>
  <div style="padding: 24px 32px; border-top: 1px solid #2a2e3a; display: flex; justify-content: flex-end;">
    <button style="background: #e8a33d; color: #1a1d26; border: none; border-radius: 4px; padding: 11px 24px; font-size: 14px; font-weight: 600; cursor: pointer;">Next →</button>
  </div>
</div>
</x-dc>
</body>
</html>
